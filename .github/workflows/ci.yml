name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Unit & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run pytest
        run: PYTHONPATH=. pytest -v

  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "app"
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  build-and-scan:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    needs: [test, trivy-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: "./app"
          file: "./app/Dockerfile"
          tags: "idp-sample-service:candidate"
          load: true
          push: false
          #no-cache: "true"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"
      - name: Inspect installed packages in image
        run: docker run --rm --entrypoint pip idp-sample-service:ci list

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "idp-sample-service:ci"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          # Added to remove the blocker of unpatched OS CVEs, as that is not the main focus of the project
          ignore-unfixed: "true"
      #ghcr login
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #tag image and push
      - name: Tag and push verified image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/idp-sample-service"
          docker tag idp-sample-service:candidate "${IMAGE_BASE}:sha-${{ github.sha }}"
          docker tag idp-sample-service:candidate "${IMAGE_BASE}:latest"
          docker push "${IMAGE_BASE}:sha-${{ github.sha }}"
          docker push "${IMAGE_BASE}:latest"
