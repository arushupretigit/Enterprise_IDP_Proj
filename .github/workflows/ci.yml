name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Unit & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run pytest
        run: PYTHONPATH=. pytest -v

  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "app"
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  build-and-scan-and-update:
    name: Build & Scan Container Image, then update Kustomize manifest
    runs-on: ubuntu-latest
    needs: [test, trivy-scan]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build container image and save to a tar archive (no push yet)
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: "./app"
          file: "./app/Dockerfile"
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/idp-sample-service.tar
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

      # 2. Load tar into local Docker daemon for Trivy scan & push
      - name: Load image into Docker daemon
        run: docker load -i /tmp/idp-sample-service.tar

      # 3. Scan the image with Trivy BEFORE pushing to GHCR
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          input: "/tmp/idp-sample-service.tar"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: "true"
          exit-code: "1"

      # 4. Log in to GHCR 
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Find the loaded image ID, tag for GHCR, and push
      - name: Tag and push verified image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_ID=$(docker image ls -q | head -n 1)
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/idp-sample-service"
          docker tag "${IMAGE_ID}" "${IMAGE_BASE}:sha-${{ github.sha }}"
          docker tag "${IMAGE_ID}" "${IMAGE_BASE}:latest"
          docker push "${IMAGE_BASE}:sha-${{ github.sha }}"
          docker push "${IMAGE_BASE}:latest"
      
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      
      - name: Update dev overlay image tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/idp-sample-service"
          cd gitops/apps/idp-sample-service/overlays/dev
          kustomize edit set image "${IMAGE_BASE}=${IMAGE_BASE}:sha-${{ github.sha }}"

      #[skip ci] is required with the git commit to ensure that it doesnt start an infinite loop
      - name: Commit and push GitOps manifest update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/idp-sample-service/overlays/dev/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): bump dev image to sha-${{ github.sha }} [skip ci]" 
          git push origin HEAD:${{ github.ref_name }}
