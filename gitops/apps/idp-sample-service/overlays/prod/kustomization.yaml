apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: prod
    includeSelectors: false

replicas:
  - name: idp-sample-service
    count: 2

images:
  - name: ghcr.io/arushupretigit/idp-sample-service
    newTag: "latest"